    <style>
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: linear-gradient(180deg, #e8f6ff, #fff6e6); font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif; color: #3a3350; }
      .boot img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 8px 24px rgba(80, 60, 120, 0.2); animation: bootBob 1.2s ease-in-out infinite; }
      .boot p { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: 0.08em; }
      .boot i { display: block; width: 140px; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.8); overflow: hidden; }
      .boot i::after { content: ''; display: block; width: 40%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #5fc8ff, #8fe0b0); animation: bootBar 1.1s ease-in-out infinite; }
      @keyframes bootBob { 50% { transform: translateY(-8px) rotate(-3deg); } }
      @keyframes bootBar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot img, .boot i::after { animation: none; } }
    </style>
  </head>
  <body class="fan-body">
    <div id="root">
      <div class="boot" role="status">
        <img src="/icons/fan-192.png" alt="" />
        <p>せんぷうきを よういちゅう…</p>
        <i></i>
      </div>
    </div>
    <script type="module" src="/src/fan/main.tsx"></script>
  </body>
